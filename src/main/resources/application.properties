spring.application.name=Cedes

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/almacenes?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# App
app.security.jwt.secret=SecretKeyForJWTGenerationWithAtLeast256BitsLength
app.security.jwt.expiration=86400